<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم Firebase</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --primary: #7c4dff;
            --success: #00e676;
            --danger: #ff1744;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        h1, h2 { color: var(--primary); }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: white;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #5e35b1; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #d50000; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #333;
        }
        th { background: #2a2a2a; }
        tr:hover { background: #2a2a2a; }
        .status-active { color: var(--success); font-weight: bold; }
        .status-inactive { color: var(--danger); font-weight: bold; }
        .search-box { margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة تحكم التطبيق (Firebase)</h1>

    <!-- قسم إضافة مفتاح جديد -->
    <div class="card">
        <h2>إضافة مفتاح جديد (FIXAMODS_USERS)</h2>
        <div class="form-group">
            <label>اسم المفتاح (Key)</label>
            <input type="text" id="newKey" placeholder="مثال: DEVILXIT">
        </div>
        <div class="form-group">
            <label>اسم المستخدم</label>
            <input type="text" id="newUsername" placeholder="اسم المستخدم">
        </div>
        <div class="form-group">
            <label>مدة الصلاحية (بالأيام)</label>
            <input type="number" id="newDays" value="30">
        </div>
        <div class="form-group">
            <label>عدد الأجهزة المسموح بها</label>
            <input type="number" id="newMaxDevices" value="1">
        </div>
        <button class="btn-primary" onclick="addKey()">إضافة المفتاح</button>
    </div>

    <!-- قسم عرض المفاتيح -->
    <div class="card">
        <h2>المفاتيح الحالية (FIXAMODS_USERS)</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن مفتاح..." onkeyup="filterTable()">
        </div>
        <table id="keysTable">
            <thead>
                <tr>
                    <th>المفتاح</th>
                    <th>المستخدم</th>
                    <th>الحالة</th>
                    <th>الصلاحية</th>
                    <th>الأجهزة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="keysBody">
                <!-- سيتم تعبئتها عبر JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // رابط قاعدة البيانات الخاص بك
    const DB_URL = "https://nikhilkumarsharma-cc4e2-default-rtdb.firebaseio.com/FIXAMODS_USERS.json";

    // جلب المفاتيح عند تحميل الصفحة
    document.addEventListener("DOMContentLoaded", fetchKeys);

    // دالة جلب المفاتيح
    function fetchKeys() {
        fetch(DB_URL)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("keysBody");
                tbody.innerHTML = "";
                
                if (!data) return;

                for (const [key, value] of Object.entries(data)) {
                    const row = document.createElement("tr");
                    
                    // تحويل الحالة
                    const statusClass = (value.status === "ACTIVE") ? "status-active" : "status-inactive";
                    const statusText = value.status || "UNKNOWN";
                    
                    // تاريخ الصلاحية
                    let validity = value.validity || "غير محدد";
                    if (value.validityMode === "duration") {
                        validity = `${value.durationValue || 0} ${value.durationUnit || 'ساعة'}`;
                    }

                    row.innerHTML = `
                        <td><strong>${key}</strong></td>
                        <td>${value.username || "---"}</td>
                        <td class="${statusClass}">${statusText}</td>
                        <td>${validity}</td>
                        <td>${value.maxDevices || 1}</td>
                        <td>
                            <button class="btn-danger" onclick="deleteKey('${key}')">حذف</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                }
            })
            .catch(err => console.error("خطأ في الجلب:", err));
    }

    // دالة إضافة مفتاح جديد
    function addKey() {
        const key = document.getElementById("newKey").value.trim();
        const username = document.getElementById("newUsername").value.trim();
        const days = parseInt(document.getElementById("newDays").value);
        const maxDevices = parseInt(document.getElementById("newMaxDevices").value);

        if (!key || !username) {
            alert("الرجاء إدخال اسم المفتاح واسم المستخدم!");
            return;
        }

        // حساب تاريخ الصلاحية (بصيغة dd-MM-yyyy HH:mm:ss كما يتوقعها التطبيق)
        const now = new Date();
        now.setDate(now.getDate() + days);
        
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        
        const validityStr = `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;

        const newData = {
            "status": "ACTIVE",
            "keyStatus": "ACTIVE",
            "username": username,
            "maxDevices": maxDevices,
            "validityMode": "absolute",
            "validity": validityStr,
            "deviceId": "",
            "deviceCount": 0,
            "lastLogin": "",
            "firstLogin": ""
        };

        // رفع البيانات إلى Firebase
        fetch(`https://nikhilkumarsharma-cc4e2-default-rtdb.firebaseio.com/FIXAMODS_USERS/${key}.json`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(newData)
        })
        .then(res => res.json())
        .then(() => {
            alert("✅ تم إضافة المفتاح بنجاح!");
            document.getElementById("newKey").value = "";
            document.getElementById("newUsername").value = "";
            fetchKeys(); // تحديث الجدول
        })
        .catch(err => {
            alert("❌ حدث خطأ أثناء الإضافة!");
            console.error(err);
        });
    }

    // دالة حذف مفتاح
    function deleteKey(key) {
        if (!confirm(`هل أنت متأكد من حذف المفتاح "${key}"؟`)) return;

        fetch(`https://nikhilkumarsharma-cc4e2-default-rtdb.firebaseio.com/FIXAMODS_USERS/${key}.json`, {
            method: 'DELETE'
        })
        .then(() => {
            alert("🗑️ تم الحذف بنجاح!");
            fetchKeys();
        })
        .catch(err => {
            alert("❌ حدث خطأ أثناء الحذف!");
            console.error(err);
        });
    }

    // دالة البحث في الجدول
    function filterTable() {
        const input = document.getElementById("searchInput").value.toUpperCase();
        const rows = document.getElementById("keysBody").getElementsByTagName("tr");

        for (let i = 0; i < rows.length; i++) {
            const cells = rows[i].getElementsByTagName("td");
            let match = false;
            for (let j = 0; j < cells.length; j++) {
                if (cells[j].innerText.toUpperCase().includes(input)) {
                    match = true;
                    break;
                }
            }
            rows[i].style.display = match ? "" : "none";
        }
    }
</script>

</body>
</html>
